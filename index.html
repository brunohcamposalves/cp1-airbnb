<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Apartamento dos Sonhos em Ipanema - Apartamentos para Alugar em Rio de
      Janeiro, Rio de Janeiro, Brasil - Airbnb
    </title>
    <link rel="stylesheet" href="assets/style.css" />
    <link
      rel="shortcut icon"
      href="assets/img/airbnb-icon.jpg"
      type="image/x-icon"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <nav>
        <img class="logo-airbnb" src="/assets/img/airbnb-logo.png" alt="Airbnb Logo" />

        <div class="options-navbar">
          <ul>
            <li>
              <img
                class="image-navbar"
                src="https://a0.muscache.com/im/pictures/airbnb-platform-assets/AirbnbPlatformAssets-search-bar-icons/original/4aae4ed7-5939-4e76-b100-e69440ebeae4.png?im_w=240"
                alt="Search bar home icone"
              />
            </li>
            <li><p class="options-text">Qualquer Lugar</p></li>
            <li><p class="options-text">Qualquer Semana</p></li>
            <li><p class="options-text">Hóspodes ?</p></li>
            <li>
              <div class="search-icon">
                <i class="fa-solid fa-magnifying-glass fa-xs"></i>
              </div>
            </li>
          </ul>
        </div>

        <div class="options-final">
          <p>Torne-se um anfitrião</p>
          <div class="header-icons">
            <div class="circle-active">
              <i class="fa-solid fa-globe"></i>
            </div>
            <div class="circle-active">
              <i class="fa-solid fa-bars"></i>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <hr />

    <main>
      <h1>Apartamento dos Sonhos em Ipanema</h1>
    </main>
  </body>
  <script
    src="https://kit.fontawesome.com/6ede03f451.js"
    crossorigin="anonymous"
  ></script>
</html>
